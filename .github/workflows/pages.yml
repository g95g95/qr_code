name: Deploy menu su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/qr-code-menu-landing-vjqbzw
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa le dipendenze del generatore
        run: pip install segno Pillow opencv-python-headless
      - name: Rigenera il QR e verifica che coincida con quello committato
        run: |
          python3 tools/generate_qr.py
          git diff --exit-code -- assets/
      - name: Test QR + landing page
        run: python3 tools/test_qr.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages puo' essere servito in due modi: "GitHub Actions" (deploy da
      # questo workflow) oppure "Deploy from a branch" (ci pensa GitHub).
      # Se e' impostato su branch, o se Pages non e' ancora attivo, i passi
      # successivi vengono saltati invece di far fallire il run.
      - name: Rileva come e' configurato Pages
        id: sorgente
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tipo=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/repos/${{ github.repository }}/pages" \
                 | python3 -c "import sys,json; print(json.load(sys.stdin).get('build_type','assente'))" \
                 2>/dev/null || echo assente)
          echo "tipo=$tipo" >> "$GITHUB_OUTPUT"
          case "$tipo" in
            workflow) echo "Pages usa GitHub Actions: pubblico da qui." ;;
            legacy)   echo "Pages e' servito da un branch: ci pensa GitHub, salto il deploy." ;;
            *)        echo "Pages non e' ancora attivo: Settings -> Pages -> Source." ;;
          esac

      - name: Configura Pages
        if: steps.sorgente.outputs.tipo == 'workflow'
        uses: actions/configure-pages@v5

      - name: Carica il sito
        if: steps.sorgente.outputs.tipo == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pubblica
        id: deployment
        if: steps.sorgente.outputs.tipo == 'workflow'
        uses: actions/deploy-pages@v4
